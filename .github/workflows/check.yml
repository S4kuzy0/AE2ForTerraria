name: Portable planner checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project validation/stage2/PlannerHarness/PlannerHarness.csproj
